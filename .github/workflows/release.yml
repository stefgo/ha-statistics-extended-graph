name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build and release (e.g. v0.0.5)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      # No SEG_BUILD_COUNTER here: the released bundle reports the bare
      # semver, the build counter stays with the local deploy build.
      # SEG_MINIFY is release-only: local builds stay readable.
      - run: npm run build
        env:
          SEG_MINIFY: "1"

      - name: Create release with dist asset
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          # The release body leads with this version's CHANGELOG entry, so the
          # release page says what changed; --generate-notes appends the commit
          # list below it. A tag the CHANGELOG does not know writes an empty
          # file and the release falls back to the generated notes alone.
          node scripts/release-notes.mjs "$TAG" > release-notes.md
          gh release create "$TAG" \
            --title "$TAG" \
            --notes-file release-notes.md \
            --generate-notes \
            dist/statistics-extended-graph.js
